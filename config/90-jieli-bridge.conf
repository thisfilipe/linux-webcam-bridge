# Use the shared, decoded source published by jieli-camera-bridge.service.
# Match properties that exist before the V4L2 source node is instantiated.
monitor.v4l2.rules = [
  {
    matches = [
      {
        factory.name = "api.v4l2.source"
        device.vendor.id = "0x1224"
        device.product.id = "0x2a25"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  # Direct V4L2 clients use the optional loopback. PipeWire already has its
  # native shared source, so do not advertise a duplicate camera here.
  {
    matches = [
      {
        factory.name = "api.v4l2.source"
        api.v4l2.cap.driver = "v4l2 loopback"
        api.v4l2.path = "/dev/video10"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
