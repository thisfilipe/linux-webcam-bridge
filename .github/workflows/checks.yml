name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends python3-gi gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gcc patch
      - name: Syntax and mocked tests (no USB or services)
        run: |
          /usr/bin/python3 -m compileall -q src tools tests
          /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Prepare pinned upstream source
        run: /usr/bin/python3 tools/build-plugin.py --source-only
      - name: Original versus patched acquire regression
        run: /usr/bin/python3 tests/check_pool.py
      - name: Whitespace check
        run: git show --format= --check HEAD
