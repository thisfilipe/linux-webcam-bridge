[workspace]
resolver = "3"
members = [
    "crates/jieli-core",
    "crates/jieli-usb",
    "crates/jieli-publisher",
    "crates/jieli-bridge",
]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["Linux Webcam Bridge contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
tempfile = "3"
libc = "0.2"
rustix = { version = "1.1.5", features = ["fs"] }

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"
